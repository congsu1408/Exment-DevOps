name: CI/CD Pipeline

on:
  push:
    tags:
      - "prod-*"

permissions:
  id-token: write 
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::113624067602:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to PROD Server
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=i-0e804a78c5cfeffad" \
            --parameters 'commands=["sudo /usr/local/bin/deploy-prod.sh"]' \
            --comment "Auto Deploy Prod via OIDC"