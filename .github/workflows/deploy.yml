name: CI/CD Pipeline

# Kích hoạt khi:
# 1. Push code vào nhánh 'dev' (để deploy test)
# 2. Tạo Tag bắt đầu bằng 'prod-' (để deploy prod)
on:
  push:
    branches:
      - dev
    tags:
      - "prod-*"

permissions:
  id-token: write
  contents: read

jobs:
  # --- JOB 1: DEPLOY CHO TEST (Tự động 100%) ---
  deploy-test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Development  # Dùng biến môi trường Development
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Thay Role ARN của bạn vào đây
          role-to-assume: arn:aws:iam::113624067602:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to TEST Server
        run: |
          echo "🚀 Deploying to TEST Environment..."
          # Gọi script nằm trong thư mục TEST, truyền tham số 'test'
          aws ssm send-command \
            --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /var/www/test/deploy-auto/scripts/deploy.sh test"]' \
            --comment "Auto Deploy to Test"

  # --- JOB 2: DEPLOY CHO PROD (Cần duyệt Manual) ---
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    environment: Production   # Dùng môi trường Production (Sẽ dừng chờ Approve)
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Thay Role ARN của bạn vào đây
          role-to-assume: arn:aws:iam::113624067602:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to PRODUCTION Server
        run: |
          echo "Deploying to PRODUCTION Environment..."
          aws ssm send-command \
            --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /var/www/deploy-auto/scripts/deploy.sh prod"]' \
            --comment "Release to Production"