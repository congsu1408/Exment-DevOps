name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
    tags:
      - "prod-*"

permissions:
  id-token: write
  contents: read

jobs:
  # --- JOB 1: DEPLOY TO TEST (100% automated) ---
  deploy-test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Development  # Use the Development environment variables
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Replace with your Role ARN
          role-to-assume: arn:aws:iam::113624067602:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to TEST Server
        run: |
          echo "🚀 Deploying to TEST Environment..."
          # Call the script in the TEST directory, passing the 'test' parameter
          aws ssm send-command \
            --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /var/www/test/deploy-auto/scripts/deploy.sh test"]' \
            --comment "Auto Deploy to Test"

  # --- JOB 2: DEPLOY TO PROD (requires manual approval) ---
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    environment: Production   # Use the Production environment (will wait for approval)
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Replace with your Role ARN
          role-to-assume: arn:aws:iam::113624067602:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to PRODUCTION Server
        run: |
          echo "Deploying to PRODUCTION Environment..."
          aws ssm send-command \
            --instance-ids ${{ vars.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /var/www/deploy-auto/scripts/deploy.sh prod"]' \
            --comment "Release to Production"