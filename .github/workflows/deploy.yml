name: CI/CD Pipeline
# 1.3.5
on:
  push:
    tags:
      - "prod-*"

permissions:
  id-token: write 
  contents: read

concurrency: 
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-Deploy-Role
          aws-region: ap-northeast-1

      - name: Deploy to PROD Server
        run: |
          aws ssm send-command \
            --document-name "Exment-Deploy-Prod-Doc" \
            --targets "Key=instanceids,Values=${{ secrets.PROD_INSTANCE_ID }}" \
            --cloud-watch-output-config '{"CloudWatchOutputEnabled":true, "CloudWatchLogGroupName":"/aws/ssm/Exment-Deploy-Logs"}' \
            --comment "Trigger Safe Deploy via GitHub Actions"